<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111d21">
<title>Suomisaundi System — Community Platform</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark;background:#101b1f;color:#eff9f4}
*{box-sizing:border-box}body{margin:0}header{padding:30px max(20px,5vw);border-bottom:1px solid #34494c;background:#16262a}
h1{margin:0;font-size:clamp(26px,5vw,46px)}header p{margin:8px 0;color:#b2cec5}
main{max-width:1120px;margin:0 auto;padding:28px 20px}nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:14px}
button.tile{background:#1e3135;border:1px solid #3a5757;border-radius:14px;padding:22px;color:inherit;text-align:left;font:inherit;cursor:pointer}
button.tile:hover,button.tile:focus-visible{background:#284247;border-color:#8de2c4}
.tile strong{display:block;font-size:19px;margin:8px 0}.tile span{font-size:14px;color:#b4ccc6}
section{margin-top:28px;border:1px solid #3a5757;background:#18292e;padding:25px;border-radius:15px;min-height:160px}
a{color:#90e4cb}li{margin:9px 0}footer{color:#a9c4bb;text-align:center;padding:24px}
</style>
</head>
<body>
<header><h1>Suomisaundi System</h1><p>Community · Culture · Music · Knowledge</p></header>
<main><nav id="menu" aria-label="System modules"></nav><section id="panel" aria-live="polite"></section></main>
<footer>Suomisaundi United · Independent community platform</footer>
<script src="./index.js" defer></script>
</body>
</html>
